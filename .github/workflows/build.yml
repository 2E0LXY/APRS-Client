name: Build APRSNET Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Linux DEB
        run: npm run build:linux -- --publish never

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows EXE
        run: npm run build:win -- --publish never

      - name: Smoke test Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows setup installer was produced." }
          $target = Join-Path $env:LOCALAPPDATA "Programs\APRSNET Desktop"
          Remove-Item -Recurse -Force $target -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/currentuser") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $app = Get-ChildItem -Path $target -Filter "APRSNET Desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "Installer completed but APRSNET Desktop.exe was not installed under $target." }
          $uninstaller = Get-ChildItem -Path $target -Filter "Uninstall*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstaller) { & $uninstaller.FullName /S }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-windows-exe
          path: dist/*.exe
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-windows-exe
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

