name: Build APRSNET Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Linux DEB
        run: npm run build:linux -- --publish never

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows package
        run: npm run build:win -- --publish never

      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:APRSNET_VERSION = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          Push-Location scripts
          try {
            & $iscc installer.iss
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Smoke test Windows packages
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip package was produced." }
          $extract = Join-Path $env:TEMP "aprsnet-desktop-zip-smoke"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $app = Get-ChildItem -Path $extract -Filter "APRSNET Desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "Windows zip did not contain APRSNET Desktop.exe." }
          $portable = Get-ChildItem dist -Filter "APRSNET.Desktop.Portable.*.exe" | Select-Object -First 1
          if (-not $portable) { throw "No Windows portable executable was produced." }
          $parseErrors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content scripts\install-windows.ps1 -Raw), [ref]$parseErrors)
          if ($parseErrors) {
            $parseErrors | Format-List *
            throw "Windows installer script failed PowerShell syntax validation."
          }
          $installer = Get-ChildItem dist -Filter "APRSNET.Desktop.Setup.*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Inno Setup installer was produced." }
          $installDir = Join-Path $env:TEMP "aprsnet-desktop-inno-smoke"
          $installLog = Join-Path $env:TEMP "aprsnet-desktop-inno-smoke.log"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"", "/LOG=`"$installLog`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 }
            throw "Inno installer timed out after 120 seconds."
          }
          if ($process.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 }
            throw "Inno installer failed with exit code $($process.ExitCode)."
          }
          if (-not (Test-Path (Join-Path $installDir "APRSNET Desktop.exe"))) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 120 }
            throw "Inno installer completed but APRSNET Desktop.exe was not installed."
          }
          $uninstaller = Get-ChildItem -Path $installDir -Filter "unins*.exe" | Select-Object -First 1
          if ($uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -PassThru
            $null = $uninstall.WaitForExit(60000)
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: |
            dist/*.zip
            dist/*.exe
            scripts/install-windows.ps1
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: dist/

      - name: Stage release files
        run: |
          mkdir -p release-assets
          find dist -type f \( -name "*.deb" -o -name "*.zip" -o -name "*.exe" -o -name "install-windows.ps1" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

