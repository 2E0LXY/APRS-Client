name: Build APRSNET Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Linux DEB
        run: npm run build:linux -- --publish never

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows installers
        run: npm run build:win -- --publish never

      - name: Smoke test Windows MSI
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter "*.msi" | Select-Object -First 1
          if (-not $installer) { throw "No Windows MSI installer was produced." }
          $log = Join-Path $env:TEMP "aprsnet-desktop-msi.log"
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", "`"$($installer.FullName)`"", "/qn", "/norestart", "ALLUSERS=2", "MSIINSTALLPERUSER=1", "/L*v", "`"$log`"") -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw "MSI install timed out after 120 seconds."
          }
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $paths = @(
            Join-Path $env:ProgramFiles "APRSNET Desktop"
            Join-Path $env:LOCALAPPDATA "Programs\APRSNET Desktop"
            Join-Path $env:LOCALAPPDATA "Programs\aprsnet-desktop"
            Join-Path $env:LOCALAPPDATA "APRSNET Desktop"
            Join-Path $env:LOCALAPPDATA "aprsnet-desktop"
          )
          $app = Get-ChildItem -Path $paths -Filter "APRSNET Desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) {
            $uninstall = Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* , HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq "APRSNET Desktop" } |
              Select-Object -First 1
            if ($uninstall.InstallLocation) {
              $app = Get-ChildItem -Path $uninstall.InstallLocation -Filter "APRSNET Desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $app) {
            Write-Host "APRS-related folders under LOCALAPPDATA:"
            Get-ChildItem -Path $env:LOCALAPPDATA -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "APRS|aprs" } | Select-Object FullName
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "Installer completed but APRSNET Desktop.exe was not found. MSI log: $log"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

