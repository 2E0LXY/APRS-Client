name: Build APRSNET Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Build Linux DEB
        run: npm run build:linux -- --publish never

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Windows package
        run: npm run build:win -- --publish never

      - name: Smoke test Windows zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip package was produced." }
          $extract = Join-Path $env:TEMP "aprsnet-desktop-zip-smoke"
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip.FullName -DestinationPath $extract -Force
          $app = Get-ChildItem -Path $extract -Filter "APRSNET Desktop.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw "Windows zip did not contain APRSNET Desktop.exe." }
          $portable = Get-ChildItem dist -Filter "APRSNET.Desktop.Portable.*.exe" | Select-Object -First 1
          if (-not $portable) { throw "No Windows portable executable was produced." }
          $parseErrors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content scripts\install-windows.ps1 -Raw), [ref]$parseErrors)
          if ($parseErrors) {
            $parseErrors | Format-List *
            throw "Windows installer script failed PowerShell syntax validation."
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: |
            dist/*.zip
            dist/*.exe
            scripts/install-windows.ps1
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-linux-deb
          path: dist/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: aprsnet-desktop-windows
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

